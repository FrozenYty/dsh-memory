name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit-message check reads every commit in the pull request, not only the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Syntax
        run: |
          node --check index.js
          node --check notebook-core.js
          for script in scripts/*.mjs; do node --check "$script"; done

      - name: Tests
        run: node tests/core.test.mjs

      - name: Recall judgements
        run: node scripts/eval-recall.mjs

      - name: No machine-specific paths
        run: node scripts/check-paths.mjs

      - name: Documents consistent
        run: node scripts/check-docs.mjs

      - name: Evidence completeness
        run: node scripts/check-evidence.mjs --dir tests/fixtures/notebook

      - name: Index agrees with the directory
        run: node scripts/check-index.mjs --dir tests/fixtures/notebook

      - name: No tool credited as a co-author
        if: github.event_name == 'pull_request'
        run: node scripts/check-commit-messages.mjs --range "origin/${{ github.base_ref }}..HEAD"
